# Production single-instance Compose for AWS Lightsail (or any docker host).
# Stack: Postgres + Rails + Caddy (TLS + static SPA).
#
# Notes:
#   * SolidQueue runs IN-PROC under Puma (`config/puma.rb` plugin), so no separate
#     worker container is needed.
#   * Persist Postgres + ActiveStorage to named volumes; back them up via
#     `bin/erp-setup db:dump` or a host-level snapshot.

version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-erp_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/your-org/shopify_erp_2-backend:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-erp_production}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SHOPIFY_SHOP_DOMAIN: ${SHOPIFY_SHOP_DOMAIN}
      SHOPIFY_ADMIN_TOKEN: ${SHOPIFY_ADMIN_TOKEN}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_WEBHOOK_SECRET: ${SHOPIFY_WEBHOOK_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-https://erp.example.com}
      RAILS_LOG_TO_STDOUT: "1"
      SOLID_QUEUE_IN_PUMA: "1"
    volumes:
      - storage:/rails/storage
    expose:
      - "3010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3010/up"]
      interval: 30s
      timeout: 10s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend-dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
