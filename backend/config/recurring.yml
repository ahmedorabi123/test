#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  shopify_catchup:
    command: "Rails.application.load_tasks unless Rake::Task.task_defined?('bootstrap:catchup'); Rake::Task['bootstrap:catchup'].reenable; Rake::Task['bootstrap:catchup'].invoke"
    schedule: every 15 minutes
  webhook_event_sweeper:
    class: Webhooks::SweepStuckJob
    queue: webhooks
    schedule: every 10 minutes

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  shopify_catchup:
    command: "Rails.application.load_tasks unless Rake::Task.task_defined?('bootstrap:catchup'); Rake::Task['bootstrap:catchup'].reenable; Rake::Task['bootstrap:catchup'].invoke"
    schedule: every 15 minutes
  webhook_event_sweeper:
    class: Webhooks::SweepStuckJob
    queue: webhooks
    schedule: every 10 minutes
